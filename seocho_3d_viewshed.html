<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>서초 3D 가시선 분석</title><script src="https://cesium.com/downloads/cesiumjs/releases/1.132/Build/Cesium/Cesium.js"></script><link href="https://cesium.com/downloads/cesiumjs/releases/1.132/Build/Cesium/Widgets/widgets.css" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#101927;color:#e9f1fa;font:14px system-ui,'Apple SD Gothic Neo',sans-serif}#map{position:absolute;inset:0}.panel{position:absolute;top:12px;left:12px;width:min(350px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow:auto;background:#111d2bee;border:1px solid #506070;border-radius:14px;padding:16px;box-shadow:0 8px 30px #0008}h2{margin:0 0 6px;font-size:18px}p{margin:5px 0 12px;color:#b3c5d4;font-size:12px;line-height:1.5}label{display:block;margin:11px 0 5px;font-weight:600}input,select,button{width:100%;border-radius:8px;padding:10px;border:1px solid #516479;background:#203044;color:white;font:inherit}input[type=range]{padding:0}button{cursor:pointer;background:#2868bd;border:0;font-weight:700;margin-top:8px}button.secondary{background:#35485b}.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}.muted{color:#aebdcb;font-size:12px}#status{padding:9px;border-radius:8px;background:#22374a;margin-top:10px;white-space:pre-wrap;font-size:12px;line-height:1.5}.legend{display:flex;gap:12px;margin-top:10px;font-size:12px}.swatch{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}.fold{display:none}@media(max-width:650px){.panel{top:auto;bottom:8px;max-height:52dvh;padding:12px}h2{font-size:16px}.panel.collapsed .controls{display:none}.panel.collapsed{max-height:none}#toggle{display:block}}@media(min-width:651px){#toggle{display:none}}</style></head><body><div id="map"></div><div class="panel" id="panel"><h2>서초 3D 가시선 분석</h2><p>실제 OSM 3D 건물 기반 · 실험용 분석</p><button class="secondary" id="toggle">설정 접기 / 펼치기</button><div class="controls"><label>Cesium ion 접근 토큰</label><input id="token" type="password" placeholder="ion access token 입력"><button id="load">3D 건물 불러오기</button><label>분석 모드</label><select id="mode"><option value="area">360° 가시권 표본 분석</option><option value="line">두 지점 간 가시선</option></select><div class="row"><div><label>분석 반경</label><select id="radius"><option value="300">300m</option><option value="500" selected>500m</option><option value="1000">1km</option><option value="2000">2km</option></select></div><div><label>관측 높이</label><select id="height"><option value="1.7">표면 + 1.7m</option><option value="3" selected>표면 + 3m</option><option value="10">표면 + 10m</option><option value="20">표면 + 20m</option></select></div></div><label>분석 해상도</label><select id="density"><option value="12">빠름 (12방향)</option><option value="24" selected>보통 (24방향)</option><option value="48">정밀 (48방향)</option></select><button id="analyze">선택 지점 분석</button><div class="row"><button class="secondary" id="clear">결과 지우기</button><button class="secondary" id="home">서초구로 이동</button></div><div class="legend"><span><i class="swatch" style="background:#43e89b"></i>가시</span><span><i class="swatch" style="background:#ff6875"></i>차폐</span><span><i class="swatch" style="background:#ffce60"></i>미확인</span></div><p>지도를 터치해 관측점을 선택하세요. 두 지점 모드는 첫 번째 지점과 두 번째 지점을 순서대로 선택합니다. 표면 높이는 옥상 또는 지면이 될 수 있습니다.</p></div><div id="status">준비 중…</div></div><script>
const $=id=>document.getElementById(id);const SEOCHO={lon:127.011,lat:37.483};let viewer,buildings=null,pointA=null,pointB=null,markers=[],results=[],busy=false;const C=()=>window.Cesium;
function status(s){$('status').textContent=s}function cart(lon,lat,h){return C().Cartesian3.fromDegrees(lon,lat,h)}function coord(p){const q=C().Cartographic.fromCartesian(p);return {lon:C().Math.toDegrees(q.longitude),lat:C().Math.toDegrees(q.latitude),h:q.height}}function clearResults(){if(!viewer)return;results.forEach(e=>viewer.entities.remove(e));results=[];status('결과를 지웠습니다. 선택 지점은 유지됩니다.')}function resetPoints(){markers.forEach(e=>viewer.entities.remove(e));markers=[];pointA=pointB=null}
function marker(p,label,color){const e=viewer.entities.add({position:cart(p.lon,p.lat,p.h+2),point:{pixelSize:13,color,outlineColor:C().Color.WHITE,outlineWidth:2,disableDepthTestDistance:Number.POSITIVE_INFINITY},label:{text:label,font:'14px sans-serif',pixelOffset:new C().Cartesian2(0,-24),fillColor:C().Color.WHITE,showBackground:true,backgroundColor:C().Color.fromCssColorString('#172638')}});markers.push(e)}
function init(){if(!window.Cesium){status('Cesium 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인하세요.');return}viewer=new Cesium.Viewer('map',{baseLayerPicker:false,geocoder:false,homeButton:false,sceneModePicker:false,navigationHelpButton:false,animation:false,timeline:false,infoBox:false,selectionIndicator:false,terrainProvider:new Cesium.EllipsoidTerrainProvider(),imageryProvider:new Cesium.OpenStreetMapImageryProvider({url:'https://tile.openstreetmap.org/'})});viewer.scene.globe.depthTestAgainstTerrain=true;home();viewer.screenSpaceEventHandler.setInputAction(click,Cesium.ScreenSpaceEventType.LEFT_CLICK);status('지도를 터치하여 관측점을 선택하세요. 실제 건물 분석에는 토큰과 3D 건물 로딩이 필요합니다.');}
function home(){viewer.camera.flyTo({destination:cart(SEOCHO.lon,SEOCHO.lat,9000),orientation:{heading:0,pitch:Cesium.Math.toRadians(-55),roll:0}})}
async function loadBuildings(){const token=$('token').value.trim();if(!token){status('Cesium ion 토큰을 입력하세요. https://ion.cesium.com/tokens 에서 발급할 수 있습니다.');return}Cesium.Ion.defaultAccessToken=token;status('실제 OSM 3D 건물을 불러오는 중…');try{if(buildings)viewer.scene.primitives.remove(buildings);buildings=await Cesium.createOsmBuildingsAsync();viewer.scene.primitives.add(buildings);status('3D 건물 로딩 성공. 화면에 건물이 충분히 표시된 뒤 지점을 선택하세요. 데이터 누락 지역은 정확한 판정이 불가능합니다.')}catch(e){buildings=null;status('3D 건물 로딩 실패: '+e.message+'\n토큰 권한과 네트워크를 확인하세요.')}}
function click(m){if(busy)return;const scene=viewer.scene;let pos;if(scene.pickPositionSupported)pos=scene.pickPosition(m.position);if(!Cesium.defined(pos)){const ray=viewer.camera.getPickRay(m.position);pos=scene.globe.pick(ray,scene)}if(!pos)return;const p=coord(pos);if($('mode').value==='area'){resetPoints();clearResults();pointA=p;marker(p,'관측점',Cesium.Color.CYAN);status(`관측점 선택: ${p.lat.toFixed(6)}, ${p.lon.toFixed(6)}\n표면 고도 ${p.h.toFixed(1)}m. 분석 버튼을 누르세요.`)}else{if(!pointA||pointB){resetPoints();clearResults();pointA=p;marker(p,'A 관측점',Cesium.Color.CYAN);status('A 지점 선택. B 지점을 터치하세요.')}else{pointB=p;marker(p,'B 목표점',Cesium.Color.YELLOW);status('A → B 선택 완료. 분석 버튼을 누르세요.')}}}
function destination(origin,bearing,d){const R=6378137,lat1=origin.lat*Math.PI/180,lon1=origin.lon*Math.PI/180,ad=d/R;const lat2=Math.asin(Math.sin(lat1)*Math.cos(ad)+Math.cos(lat1)*Math.sin(ad)*Math.cos(bearing));const lon2=lon1+Math.atan2(Math.sin(bearing)*Math.sin(ad)*Math.cos(lat1),Math.cos(ad)-Math.sin(lat1)*Math.sin(lat2));return {lat:lat2*180/Math.PI,lon:lon2*180/Math.PI}}
async function sample(points){const cs=points.map(p=>Cesium.Cartographic.fromDegrees(p.lon,p.lat));try{await viewer.scene.sampleHeightMostDetailed(cs);return cs.map(x=>Number.isFinite(x.height)?x.height:null)}catch(e){return points.map(()=>null)}}
function dot(p,color){results.push(viewer.entities.add({position:cart(p.lon,p.lat,p.h+1),point:{pixelSize:6,color,disableDepthTestDistance:Number.POSITIVE_INFINITY}}))}function line(a,b,color){results.push(viewer.entities.add({polyline:{positions:[cart(a.lon,a.lat,a.h),cart(b.lon,b.lat,b.h)],width:3,material:color,clampToGround:false}}))}
async function checkLine(a,b,steps=35){const samples=[];for(let i=1;i<steps;i++){const t=i/steps;samples.push({lon:a.lon+(b.lon-a.lon)*t,lat:a.lat+(b.lat-a.lat)*t})}const heights=await sample(samples);if(heights.some(h=>h===null))return null;for(let i=0;i<heights.length;i++){const t=(i+1)/steps;const sight=a.h+(b.h-a.h)*t;if(heights[i]>sight+1.5)return false}return true}
async function analyze(){if(busy)return;if(!buildings){status('실제 3D 건물을 먼저 불러오세요. 건물 없이 분석하면 차폐 판정이 신뢰할 수 없습니다.');return}if(!pointA){status('먼저 지도에서 관측점을 선택하세요.');return}if($('mode').value==='line'&&!pointB){status('목표점 B도 선택하세요.');return}busy=true;$('analyze').disabled=true;clearResults();const extra=Number($('height').value);const a={...pointA,h:pointA.h+extra};try{if($('mode').value==='line'){const b={...pointB,h:pointB.h+extra};status('두 지점 사이 표면 높이 계산 중…');const ok=await checkLine(a,b,60);line(a,b,ok===null?Cesium.Color.YELLOW:ok?Cesium.Color.LIME:Cesium.Color.RED);status(ok===null?'판정 불가: 일부 표면 높이 데이터가 없습니다.':ok?'가시선 확보 (표면 표본 기준)':'가시선 차폐 (표면 표본 기준)')}else{const radius=Number($('radius').value),n=Number($('density').value);let vis=0,blocked=0,unknown=0;const endpoints=[];for(let k=0;k<n;k++){const angle=k*2*Math.PI/n;for(let j=1;j<=8;j++){const p=destination(a,angle,radius*j/8);endpoints.push({...p,d:radius*j/8,k,j})}}status('주변 건물·지형 표면 높이 샘플링 중…');const heights=await sample(endpoints);const originHeight=a.h;for(let k=0;k<n;k++){let maxSlope=-Infinity,uncertain=false;for(let j=1;j<=8;j++){const idx=k*8+j-1,p=endpoints[idx],h=heights[idx];if(h===null){unknown++;uncertain=true;dot({...p,h:originHeight},Cesium.Color.YELLOW);continue}const slope=(h-originHeight)/p.d;const visible=!uncertain&&slope>=maxSlope-0.002;if(visible)vis++;else blocked++;maxSlope=Math.max(maxSlope,slope);dot({...p,h},visible?Cesium.Color.LIME:Cesium.Color.RED)}}status(`표면 표본 분석 완료 (${n}방향 × 8거리)\n가시 ${vis}개 / 차폐 ${blocked}개 / 미확인 ${unknown}개\n주의: 색상은 표본 위치별 판정이며 연속 가시권이나 공중 표적 가시성은 의미하지 않습니다.`)}}}catch(e){status('분석 오류: '+e.message)}finally{busy=false;$('analyze').disabled=false}}
$('load').onclick=loadBuildings;$('home').onclick=home;$('analyze').onclick=analyze;$('clear').onclick=()=>{clearResults();resetPoints()};$('toggle').onclick=()=>$('panel').classList.toggle('collapsed');$('mode').onchange=()=>{clearResults();resetPoints();status('모드 변경. 지도에서 지점을 다시 선택하세요.')};init();
</script></body></html>
